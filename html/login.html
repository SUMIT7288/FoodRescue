<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FoodRescue</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <div class="container">
        <div class="row justify-content-center align-items-center vh-100">
            <div class="col-md-5 col-lg-4">
                <div class="text-center mb-4">
                    <a class="navbar-brand fs-2 fw-bold text-success" href="index.html">
                        <i class="bi bi-heart-fill"></i> FOODRESCUE
                    </a>
                </div>
                <div class="card border-0 shadow-sm p-4">
                    <h3 class="fw-bold mb-3">Login</h3>
                    <p class="text-muted small mb-4">Enter your credentials to access your dashboard.</p>
                    
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" id="loginEmail" class="form-control" placeholder="name@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Login As</label>
                            <select id="loginRole" class="form-select" required>
                                <option value="RESTAURANT">Restaurant</option>
                                <option value="NGO">NGO</option>
                                <option value="ADMIN">Admin</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success w-100 py-2 mb-3">Login</button>
                    </form>
                    
                    <div class="text-center">
                        <p class="small mb-0">Don't have an account? <a href="register.html" class="text-success text-decoration-none fw-bold">Register here</a></p>
                    </div>
                </div>
                <div class="text-center mt-4">
                    <a href="index.html" class="text-muted text-decoration-none small"><i class="bi bi-arrow-left"></i> Back to Home</a>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
