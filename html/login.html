<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | FoodRescue</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row" style="justify-content: center;">
      <div class="col-md-4">
        <div class="text-center mb-3">
          <a class="navbar-brand" href="index.html">FOODRESCUE</a>
        </div>
        <div class="card p-4">
          <h3 class="fw-bold mb-3">Login</h3>
          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" id="loginEmail" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" id="loginPassword" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Role</label>
              <select id="loginRole" class="form-select" required>
                <option value="RESTAURANT">Restaurant</option>
                <option value="NGO">NGO</option>
                <option value="ADMIN">Admin</option>
              </select>
            </div>
            <button type="submit" class="btn btn-success w-100">Sign In</button>
          </form>
          <p class="small text-center mt-3 mb-0">Don't have an account? <a href="register.html" class="text-success fw-bold">Register</a></p>
        </div>
      </div>
    </div>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
