<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | FoodRescue</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-info" href="#"><i class="bi bi-shield-lock-fill"></i> ADMIN PANEL</a>
            <button onclick="logout()" class="btn btn-outline-light btn-sm">Logout</button>
        </div>
    </nav>

    <div class="container py-4">
        <h2 class="fw-bold mb-4">System Overview</h2>

        <!-- Admin Stats Grid -->
        <div class="row g-3 mb-5">
            <div class="col-md-3">
                <div class="card border-0 shadow-sm p-3 border-start border-primary border-4">
                    <div class="small text-muted fw-bold">TOTAL USERS</div>
                    <div class="h3 fw-bold mb-0" id="admin-total-users">0</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm p-3 border-start border-success border-4">
                    <div class="small text-muted fw-bold">TOTAL DONATIONS</div>
                    <div class="h3 fw-bold mb-0" id="admin-total-donations">0</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm p-3 border-start border-warning border-4">
                    <div class="small text-muted fw-bold">PENDING REQUESTS</div>
                    <div class="h3 fw-bold mb-0" id="admin-total-requests">0</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm p-3 border-start border-info border-4">
                    <div class="small text-muted fw-bold">MEALS RESCUUED</div>
                    <div class="h3 fw-bold mb-0" id="admin-meals-rescued">0</div>
                </div>
            </div>
        </div>

        <!-- Management Sections -->
        <div class="row g-4">
            <!-- User Management -->
            <div class="col-12 col-xl-5">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white py-3">
                        <h5 class="fw-bold mb-0"><i class="bi bi-people me-2"></i>Registered Users</h5>
                    </div>
                    <div class="table-responsive" style="max-height: 400px;">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Name</th>
                                    <th>Role</th>
                                    <th>Contact</th>
                                </tr>
                            </thead>
                            <tbody id="adminUsersTable">
                                <!-- Dynamic User Rows -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Global Donation Management -->
            <div class="col-12 col-xl-7">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                        <h5 class="fw-bold mb-0"><i class="bi bi-basket me-2"></i>All Donations</h5>
                        <span class="badge bg-secondary" id="donationCountBadge">0 Total</span>
                    </div>
                    <div class="table-responsive" style="max-height: 400px;">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Restaurant</th>
                                    <th>Food Item</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="adminDonationsTable">
                                <!-- Dynamic Donation Rows -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Global Request Log -->
            <div class="col-12">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white py-3">
                        <h5 class="fw-bold mb-0"><i class="bi bi-activity me-2"></i>Recent System Activity (Requests)</h5>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0 text-nowrap">
                            <thead class="table-light">
                                <tr>
                                    <th>Date</th>
                                    <th>NGO</th>
                                    <th>Requested Item</th>
                                    <th>Qty</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="adminRequestsTable">
                                <!-- Dynamic Request Rows -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
