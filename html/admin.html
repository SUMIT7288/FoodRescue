<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | FoodRescue</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">
  <nav class="navbar bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">ADMIN PORTAL</a>
      <button onclick="logout()" class="btn btn-outline-light btn-sm">Logout</button>
    </div>
  </nav>

  <div class="container py-4">
    <div class="row mb-4">
      <div class="col-md-3">
        <div class="card p-3 border-start border-primary">
          <p class="small text-muted">Total Users</p>
          <h3 id="admin-total-users">0</h3>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card p-3 border-start border-success">
          <p class="small text-muted">Total Donations</p>
          <h3 id="admin-total-donations">0</h3>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card p-3 border-start border-warning">
          <p class="small text-muted">Pending Requests</p>
          <h3 id="admin-total-requests">0</h3>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card p-3 border-start border-info">
          <p class="small text-muted">Rescued Count</p>
          <h3 id="admin-meals-rescued">0</h3>
        </div>
      </div>
    </div>

    <div class="row mb-4">
      <div class="col-xl-5">
        <div class="card">
          <div class="card-header">
            <h4>System Users</h4>
          </div>
          <div class="table-responsive" style="max-height: 350px;">
            <table class="table">
              <thead>
                <tr><th>User</th><th>Role</th><th>Contact</th></tr>
              </thead>
              <tbody id="adminUsersTable"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="col-xl-7">
        <div class="card">
          <div class="card-header">
            <h4>All Donations</h4>
          </div>
          <div class="table-responsive" style="max-height: 350px;">
            <table class="table">
              <thead>
                <tr><th>Restaurant</th><th>Food</th><th>Status</th><th>Action</th></tr>
              </thead>
              <tbody id="adminDonationsTable"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h4>Recent Platform Activity</h4>
      </div>
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr><th>Date</th><th>NGO</th><th>Food Item</th><th>Qty</th><th>Status</th></tr>
          </thead>
          <tbody id="adminRequestsTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="toast-container"></div>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
