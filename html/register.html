<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | FoodRescue</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row" style="justify-content: center;">
      <div class="col-md-6">
        <div class="text-center mb-3">
          <a class="navbar-brand" href="index.html">FOODRESCUE</a>
        </div>
        <div class="card p-4">
          <h3 class="fw-bold mb-3">Create Account</h3>
          <form id="registerForm">
            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" id="regName" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Organization Name</label>
              <input type="text" id="regOrg" class="form-control" required>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="regEmail" class="form-control" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Phone</label>
                <input type="tel" id="regPhone" class="form-control" required>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="regPass" class="form-control" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Confirm Password</label>
                <input type="password" id="regConfirmPass" class="form-control" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Account Type</label>
              <div class="d-flex gap-3">
                <label><input type="radio" name="role" value="RESTAURANT" checked> Restaurant</label>
                <label><input type="radio" name="role" value="NGO"> NGO</label>
              </div>
            </div>
            <button type="submit" class="btn btn-success w-100">Register</button>
          </form>
          <p class="small text-center mt-3 mb-0">Already registered? <a href="login.html" class="text-success fw-bold">Login</a></p>
        </div>
      </div>
    </div>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
